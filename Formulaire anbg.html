<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Demande de Bourse - ANBG</title>
<style>
/* Un peu de CSS pour avoir un rendu propre sans effort */
body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
.container { max-width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: auto; }
h2 { color: #008f39; text-align: center; } /* Vert rappelant le drapeau */
.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 5px; font-weight: bold; }
input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
button { width: 100%; background-color: #008f39; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 4px; font-size: 16px; font-weight: bold; }
button:hover { background-color: #006622; }

/* Classe CSS pour cacher/afficher les messages d'erreur */
.erreur { color: red; font-size: 0.85em; display: none; margin-top: 5px; }
</style>
</head>
<body>

<div class="container">
<h2>Formulaire ANBG</h2>

<!-- On donne un ID au formulaire pour le cibler en JavaScript -->
<form id="formulaireAnbg">
<div class="form-group">
<label for="nom">Nom complet :</label>
<input type="text" id="nom" placeholder="Saisissez votre nom">
<div id="msgErreurNom" class="erreur">Veuillez entrer votre nom.</div>
</div>

<div class="form-group">
<label for="nip">Numéro NIP :</label>
<input type="text" id="nip" placeholder="Ex: 123456789">
<div id="msgErreurNip" class="erreur">Le NIP est obligatoire.</div>
</div>

<div class="form-group">
<label for="email">Adresse Email :</label>
<input type="email" id="email" placeholder="Ex: etudiant@email.com">
<div id="msgErreurEmail" class="erreur">Veuillez entrer un email valide (contenant @).</div>
</div>

<div class="form-group">
<label for="etablissement">Établissement :</label>
<select id="etablissement">
<option value="">-- Choisir --</option>
<option value="AFRAM" selected>ACADEMIE FRANCO-AMERICAINE DE MANAGEMENT</option>
<option value="UOB">Université Omar Bongo (UOB)</option>
<option value="USTM">Université des Sciences et Techniques de Masuku (USTM)</option>
<option value="IAI">Institut Africain d'Informatique (IAI)</option>
<option value="INSG">Institut National des Sciences de Gestion (INSG)</option>
<option value="ENSET">École Normale Supérieure d'Enseignement Technique (ENSET)</option>
<option value="USS">Université des Sciences de la Santé (USS)</option>
<option value="BBS">BGFI Business School (BBS)</option>
<option value="EMGABON">EM-Gabon Université</option>
</select>
</div>

<div class="form-group">
<label for="niveau">Niveau d'études :</label>
<select id="niveau">
<option value="L1">Licence 1</option>
<option value="L2">Licence 2</option>
<option value="L3" selected>Licence 3</option>
<option value="Master">Master 1</option>
<option value="Master">Master 2</option>
<option value="DOCTORAT">DOCTORAT</option>
</select>
</div>

<button type="submit">Valider la demande</button>



<!-- C'est ici que la magie de la programmation événementielle opère -->
<script>
    const formulaire = document.getElementById('formulaireAnbg');

formulaire.addEventListener('submit', function(event) {
event.preventDefault();

const champNom = document.getElementById('nom').value;
const champNip = document.getElementById('nip').value;
const champEmail = document.getElementById('email').value;

const msgErreurNom = document.getElementById('msgErreurNom');
const msgErreurNip = document.getElementById('msgErreurNip');
const msgErreurEmail = document.getElementById('msgErreurEmail');

let formulaireValide = true;

// Vérification du Nom
if (champNom.trim() === "") {
msgErreurNom.style.display = "block";
formulaireValide = false;
} else {
msgErreurNom.style.display = "none";
}

// Vérification du NIP
if (champNip.trim() === "") {
msgErreurNip.style.display = "block";
formulaireValide = false;
} else {
msgErreurNip.style.display = "none";
}

// Vérification de l'Email (doit contenir un @ et un .)
if (champEmail.trim() === "" || !champEmail.includes('@') || !champEmail.includes('.')) {
msgErreurEmail.style.display = "block";
formulaireValide = false;
} else {
msgErreurEmail.style.display = "none";
}

// Validation finale
if (formulaireValide) {
alert("Félicitations ! Votre demande à l'ANBG a été enregistrée avec succès.");
formulaire.reset();
}
});

// Le code JavaScript va ici (Voir l'étape 2)
</script>

</body>
</html>
